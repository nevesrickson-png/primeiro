# Hermes Agent (Nous Research) em Docker — pasta portátil.
#
# Tudo o que o agente guarda (chaves, config.yaml, memórias, sessões, skills)
# fica em ./dados, ao lado deste arquivo. Para levar o agente para outro PC
# ou para uma VPS, basta copiar esta pasta inteira (com o container parado).
#
# Uso: veja LEIA-ME.md (ou rode ./hermes.sh / .\hermes.ps1).

services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_TAG:-latest}
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file: .env
    environment:
      # Dono dos arquivos de ./dados no host (Linux/VPS). No Windows/Mac é ignorado.
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_DASHBOARD=1
    ports:
      # Por padrão só este computador acessa (127.0.0.1). Na VPS, use túnel SSH.
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-9119}:9119"
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8642}:8642"
    volumes:
      - ./dados:/opt/data
    shm_size: 1g            # necessário para as ferramentas de navegador
    deploy:
      resources:
        limits:
          memory: ${LIMITE_MEMORIA:-4G}
          cpus: "${LIMITE_CPUS:-2.0}"
