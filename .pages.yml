# Painel de publicação do site ricksonmessias.com (Pages CMS: https://app.pagescms.org).
# Entre com a conta do GitHub, abra este repositório e use "Artigos". Cada "Salvar" vira um commit;
# na branch main, o GitHub Actions publica o site sozinho (.github/workflows/site.yml).
media:
  input: site/web/public/imagens/artigos
  output: /imagens/artigos
content:
  - name: artigos
    label: Artigos
    type: collection
    path: site/web/src/content/artigos
    view:
      fields: [titulo, categoria, data, rascunho]
      sort: [data]
      default:
        sort: data
        order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: resumo
        label: Resumo (uma linha, aparece nas listas e no Google)
        type: text
        required: true
      - name: categoria
        label: Categoria
        type: select
        required: true
        options:
          values:
            - { value: protecao, label: Proteção }
            - { value: patrimonio, label: Patrimônio de longo prazo }
            - { value: grandes-mentes, label: Grandes mentes e legados }
            - { value: bastidores, label: Bastidores do mercado }
      - name: data
        label: Data de publicação
        type: date
        required: true
      - name: em_resumo
        label: Em resumo (2 a 3 linhas com a conclusão, aparece no topo do artigo)
        type: text
      - name: capa
        label: Imagem de capa (opcional; sem imagem, o site gera uma capa da marca)
        type: image
      - name: capa_alt
        label: Descrição da imagem (acessibilidade)
        type: string
      - name: sinais
        label: Sinais de alerta (só para artigos de Proteção)
        type: string
        list: true
      - name: destaque
        label: Fixar como destaque na página inicial
        type: boolean
        default: false
      - name: rascunho
        label: Rascunho (não aparece no site publicado)
        type: boolean
        default: true
      - name: body
        label: Texto
        type: rich-text
  - name: noticias
    label: Notícias (Mercados)
    type: collection
    path: site/web/src/content/noticias
    view:
      fields: [titulo, editoria, data, rascunho]
      sort: [data]
      default:
        sort: data
        order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: linha_fina
        label: Linha fina (resumo abaixo do título)
        type: text
        required: true
      - name: editoria
        label: Editoria
        type: select
        required: true
        options:
          values:
            - { value: mercados, label: Mercados }
            - { value: economia, label: Economia }
            - { value: empresas, label: Empresas }
            - { value: fiis, label: Fundos imobiliários }
            - { value: internacional, label: Internacional }
      - name: data
        label: Data e hora de publicação
        type: date
        required: true
        options:
          time: true
      - name: atualizado
        label: Atualizado em (se corrigida)
        type: date
        options:
          time: true
      - name: autor
        label: Autor
        type: string
        default: Redação
      - name: ia
        label: Produzido com IA (mostra o selo)
        type: boolean
        default: true
      - name: tickers
        label: Ativos citados (PETR4, HGLG11, IBOV, SELIC…)
        type: string
        list: true
      - name: fontes
        label: Fontes
        type: object
        list: true
        fields:
          - { name: nome, label: Nome da fonte, type: string }
          - { name: url, label: Link, type: string }
      - name: imagem
        label: Imagem (opcional; sem imagem, o site gera uma arte)
        type: image
        options:
          input: site/web/public/imagens/noticias
          output: /imagens/noticias
      - name: imagem_alt
        label: Descrição da imagem
        type: string
      - name: imagem_credito
        label: Crédito da imagem
        type: string
      - name: destaque
        label: Manchete da capa
        type: boolean
        default: false
      - name: urgente
        label: Última hora
        type: boolean
        default: false
      - name: rascunho
        label: Rascunho (não aparece no site publicado)
        type: boolean
        default: true
      - name: body
        label: Texto
        type: rich-text
