# Publica o site ricksonmessias.com (site/web) na Hostinger a cada mudança na branch main.
# Configuração (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (dados de FTP do painel da Hostinger)
#   Variables: PUBLIC_FORM_ENDPOINT  (URL do App da Web do Apps Script)
# Sem os secrets, o workflow só compila o site (não publica).
name: Site

on:
  push:
    branches: [main]
    paths: ['site/web/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/web
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      - name: Enviar para a Hostinger (FTP)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/web/dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
